<!-- templates/constn/siteinfo_select.html -->
<p>
    <label for="code">工地編號</label>
    <input type="text" id="code" />
    <label for="owner">業主</label>
    <input type="text" id="owner" />
    <label for="name">名稱</label>
    <input type="text" id="name" />
    <input type="hidden" id="hid_code" value="{{ constn.code }}">
    <input type="hidden" id="not_wh" value="{{ not_wh|default:'False' }}">
    <input type="hidden" id="is_all" value="{{ all|default:'False' }}">
</p>
<p>
    <label for="code">工地選單</label>
    <select id="sitelist" name="site_code"></select>
</p>
<!-- JavaScript 用於篩選和更新 sitelist -->
<script>
    // AJAX 請求獲取 sitelist 資料
    function fetchSitelist() {
        $.ajax({
            url: '/constn/get_sitelist/',  // Django 後端的 API 路徑
            method: 'GET',
            success: function(data) {
                updateSitelist(data);  // 調用函數更新下拉框
            },
            error: function(xhr, status, error) {
                console.error("Error fetching sitelist:", error);
            }
        });
    }

    function updateSitelist(data) {
        // 取得輸入框的值
        const code = $('#code').val().trim();
        const owner = $('#owner').val().trim();
        const name = $('#name').val().trim();
        const hid_code = $('#hid_code').val();
        const not_wh = $('#not_wh').val().trim() === 'True';
        const is_all = $('#is_all').val().trim() === 'True';
        // 清空現有的 sitelist
        $('#sitelist').empty();
        if (is_all){
            const option = $('<option>', {
                value: '',
                text: '全部'
            });
            $('#sitelist').append(option);
        }
        // 遍歷 data 進行篩選
        $.each(data, function (index, item) {
            // 判斷是否符合篩選條件
            const matchesCode = !code || item.code.startsWith(code);
            const matchesOwner = !owner || item.owner.startsWith(owner);
            const matchesName = !name || item.name.includes(name);


            // 如果符合篩選條件，處理選項
            if (matchesCode && matchesOwner && matchesName) {
                // 設置選項文字
                let optionText = `${item.code}|${item.owner}`;
                if (item.name && item.name.trim()) {
                    optionText += `|${item.name.substring(0, 6)}`;
                }

                // 創建選項
                const option = $('<option>', {
                    value: item.code,
                    text: optionText
                });

                // 如果匹配 hid_code，則設為選中
                if (hid_code === item.code) {
                    option.prop('selected', true);
                }

                if (not_wh && ['0000', '0001', '0002', '0003','0004'].includes(item.code)){
                    return true;
                }
                // 判斷是否需要排除不在倉庫的條件

                $('#sitelist').append(option);

            }
        });
    }

    // 當頁面加載完成時，初始化 sitelist
    $(document).ready(function () {
        fetchSitelist();  // 初始化顯示所有 sitelist
    });

    // 綁定輸入框的事件處理器，當輸入框內容變化時更新 sitelist
    // 當輸入框內容變化時重新篩選選項
    $('#code, #owner, #name').on('input', function() {
        fetchSitelist();
    });
</script>
